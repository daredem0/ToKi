[project]
name = "TopDownBundle"
version = "1.0.0"
created = "2025-08-28T20:32:34.920817717Z"
modified = "2026-03-29T11:46:35.864052065Z"
toki_editor_version = "0.1.0"
description = ""

[scenes]
"Scene 2" = "scenes/Scene 2.json"
"Main Scene" = "scenes/Main Scene.json"
main = "scenes/main.json"

[assets]
sprites = "assets/sprites/"
tilemaps = "assets/tilemaps/"
audio = "assets/audio/"

[runtime]
scene_persistence = true

[runtime.splash]
duration_ms = 1200

[runtime.audio]
master_percent = 100
music_percent = 80
movement_percent = 80
collision_percent = 10

[runtime.display]
show_entity_health_bars = true
show_ground_shadows = true
resolution_width = 160
resolution_height = 144
zoom_percent = 100
vsync = false
target_fps = 30
timing_mode = "delta"

[runtime.display.post_process]
mode = "none"
quantize_strategy = "luminance"
tint_color = [
    32,
    64,
    96,
    255,
]
tint_strength_percent = 35
brightness_percent = 0
saturation_percent = 100
quantize_palette_id = "gray"
gb_contrast_percent = 0
vignette_strength_percent = 60

[runtime.display.viewport]
mode = "integer_scale"
factor = 5

[runtime.menu]
pause_root_screen_id = "pause_menu"
gate_gameplay_when_open = true

[runtime.menu.appearance]
font_family = "Serif"
font_size_px = 30
menu_width_percent = 65
menu_height_percent = 85
title_spacing_px = 32
button_spacing_px = 12
footer_spacing_px = 128
opacity_percent = 50
border_thickness_px = 2
border_color_hex = "#7CFF7C"
text_color_hex = "#FFFFFF"
menu_background_color_hex = "#142914"
menu_background_transparent = false
title_background_color_hex = "#143614"
title_background_transparent = true
entry_background_color_hex = "#0F1F0F"
entry_background_transparent = false
footer_text = """
          Esc: Back   
Enter/Space: Select"""
border_style = "square"
dialog_position = "top"

[runtime.menu.appearance.dialog_speaker_text]
font_family = "Sans"
font_size_px = 18
bold = true
cursive = false

[runtime.menu.appearance.dialog_body_text]
font_family = "Sans"
font_size_px = 14
bold = false
cursive = false

[[runtime.menu.screens]]
id = "pause_menu"
title = "Paused"
title_border_style_override = "none"

[[runtime.menu.screens.items]]
kind = "button"
text = "Resume"

[runtime.menu.screens.items.action]
kind = "close_ui"

[[runtime.menu.screens.items]]
kind = "button"
text = "Inventory"

[runtime.menu.screens.items.action]
kind = "open_surface"
surface_id = "inventory_menu"

[[runtime.menu.screens.items]]
kind = "button"
text = "Audio Settings"

[runtime.menu.screens.items.action]
kind = "open_audio_settings"

[[runtime.menu.screens.items]]
kind = "button"
text = "Graphics Settings"

[runtime.menu.screens.items.action]
kind = "open_graphics_settings"

[[runtime.menu.screens.items]]
kind = "button"
text = "Save Game"

[runtime.menu.screens.items.action]
kind = "save_game"
slot = 1

[[runtime.menu.screens.items]]
kind = "button"
text = "Load Game"

[runtime.menu.screens.items.action]
kind = "load_game"
slot = 1

[[runtime.menu.screens.items]]
kind = "button"
text = "Exit Game"

[runtime.menu.screens.items.action]
kind = "open_surface"
surface_id = "end_game"

[[runtime.menu.screens]]
id = "inventory_menu"
title = "Inventory"

[[runtime.menu.screens.items]]
kind = "dynamic_list"
heading = "Items"
source = "player_inventory"
empty_text = "Inventory is empty"

[[runtime.menu.screens.items]]
kind = "button"
text = "Back"

[runtime.menu.screens.items.action]
kind = "back"

[[runtime.menu.dialogs]]
id = "end_game"
title = "End Game"
body = "Are you sure?"
confirm_text = "Confirm"
cancel_text = "Cancel"
hide_main_menu = true

[runtime.menu.dialogs.confirm_action]
kind = "exit_runtime"

[runtime.menu.dialogs.cancel_action]
kind = "close_surface"

[[runtime.menu.dialogs]]
id = "new_dialog"
title = "New Dialog"
body = "Are you sure?"
confirm_text = "Confirm"
cancel_text = "Cancel"

[runtime.menu.dialogs.confirm_action]
kind = "close_surface"

[runtime.menu.dialogs.cancel_action]
kind = "close_surface"

[runtime.dialog_appearance]
font_family = "Mono"
font_size_px = 14
menu_width_percent = 60
menu_height_percent = 60
title_spacing_px = 6
button_spacing_px = 6
footer_spacing_px = 6
opacity_percent = 70
border_thickness_px = 4
border_color_hex = "#000000"
text_color_hex = "#000000"
menu_background_color_hex = "#FFFFFF"
menu_background_transparent = false
title_background_color_hex = "#FFFFFF"
title_background_transparent = false
entry_background_color_hex = "#FFFFFF"
entry_background_transparent = false
footer_text = "Esc: Back   Enter/Space: Select"
border_style = "square"
dialog_position = "bottom"

[runtime.dialog_appearance.dialog_speaker_text]
font_family = "Sans"
font_size_px = 18
bold = false
cursive = false

[runtime.dialog_appearance.dialog_body_text]
font_family = "Sans"
font_size_px = 16
bold = false
cursive = true

[[runtime.flags.declarations]]
id = "coins"

[runtime.flags.declarations.default_value]
type = "int"
value = 0

[[runtime.flags.declarations]]
id = "has_coins"

[runtime.flags.declarations.default_value]
type = "bool"
value = true

[runtime.scene_transitions]
default_effect = "fade"
default_duration_ms = 250

