[package]
name = "toki-editor"
version.workspace = true
edition.workspace = true
build = "build.rs"
license-file = "../../LICENSE.md"
description = "GUI editor for authoring ToKi scenes, entities, and assets."
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[package.metadata.deb]
maintainer = "f.leuze@outlook.de"
depends = "libasound2"
recommends = "libvulkan1"
section = "devel"
priority = "optional"
assets = [
    ["../../target/release/toki-editor", "usr/bin/toki-editor", "755"],
    ["../../target/release/toki-runtime", "usr/bin/toki-runtime", "755"],
    ["../../LICENSE-TOKI.md", "usr/share/doc/toki-editor/LICENSE-TOKI.md", "644"],
    ["../../THIRD_PARTY_LICENSES.md", "usr/share/doc/toki-editor/THIRD_PARTY_LICENSES.md", "644"],
    ["../../packaging/toki-editor.desktop", "usr/share/applications/toki-editor.desktop", "644"],
    ["../../packaging/toki-editor.png", "usr/share/icons/hicolor/128x128/apps/toki-editor.png", "644"],
]

[features]
default = ["editor"]
editor = []

[dependencies]
anyhow = "1.0.99"
toki-core = { path = "../toki-core", version = "0.2.2" }
toki-render = { path = "../toki-render", version = "0.2.2", features = ["editor"] }
toki-schemas = { path = "../toki-schemas", version = "0.2.2" }
glam = "0.30.5"
pollster = "0.4.0"
wgpu = "25.0.2"
winit = { version = "0.30.12", features = ["wayland", "wayland-dlopen", "wayland-csd-adwaita"] }
egui = "0.32"
egui-winit = "0.32"
egui-wgpu = "0.32"
tracing.workspace = true
tracing-subscriber.workspace = true

# Project management dependencies
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.15"
chrono = { version = "0.4", features = ["serde"] }
jsonschema = "0.18"
strum = { version = "0.26", features = ["derive"] }

[dev-dependencies]
tempfile = "3.21.0"
