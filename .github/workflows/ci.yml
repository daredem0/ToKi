name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build-debug-linux:
    name: Build (debug, Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Verify tag/version consistency
        run: ./scripts/verify-tag-version.sh

      - name: Build debug binaries
        run: cargo build --locked -p toki-runtime -p toki-editor

      - name: Upload debug binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binary-debug-linux
          path: |
            target/debug/toki-runtime
            target/debug/toki-editor
          if-no-files-found: error

  build-debug-windows:
    name: Build (debug, Windows)
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/') || github.ref_name == 'main' || github.ref_name == 'develop' || github.base_ref == 'main' || github.base_ref == 'develop'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Verify tag/version consistency
        shell: bash
        run: ./scripts/verify-tag-version.sh

      - name: Build debug binaries
        run: cargo build --locked -p toki-runtime -p toki-editor

      - name: Upload debug binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binary-debug-windows
          path: |
            target/debug/toki-runtime.exe
            target/debug/toki-editor.exe
          if-no-files-found: error

  build-release-linux:
    name: Build (release, Linux)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Verify tag/version consistency
        run: ./scripts/verify-tag-version.sh

      - name: Build release binaries
        run: |
          if TAG="$(git describe --tags --exact-match HEAD 2>/dev/null)"; then
            VERSION="${TAG#v}"
            echo "Building tagged release with version override: ${VERSION}"
            TOKI_VERSION_OVERRIDE="${VERSION}" cargo build --locked --release -p toki-runtime -p toki-editor
          else
            cargo build --locked --release -p toki-runtime -p toki-editor
          fi

      - name: Upload release binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binary-release-ubuntu-22.04
          path: |
            target/release/toki-runtime
            target/release/toki-editor
          if-no-files-found: error

  build-release-windows:
    name: Build (release, Windows)
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/') || github.ref_name == 'main' || github.ref_name == 'develop' || github.base_ref == 'main' || github.base_ref == 'develop'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Verify tag/version consistency
        shell: bash
        run: ./scripts/verify-tag-version.sh

      - name: Build release binaries
        shell: bash
        run: |
          if TAG="$(git describe --tags --exact-match HEAD 2>/dev/null)"; then
            VERSION="${TAG#v}"
            echo "Building tagged release with version override: ${VERSION}"
            TOKI_VERSION_OVERRIDE="${VERSION}" cargo build --locked --release -p toki-runtime -p toki-editor
          else
            cargo build --locked --release -p toki-runtime -p toki-editor
          fi

      - name: Upload release binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binary-release-windows
          path: |
            target/release/toki-runtime.exe
            target/release/toki-editor.exe
          if-no-files-found: error

  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked --workspace --all-targets

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/') || github.ref_name == 'main' || github.ref_name == 'develop' || github.base_ref == 'main' || github.base_ref == 'develop'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked --workspace --all-targets

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  fmt:
    name: Fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Install Rust toolchain with llvm-tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run coverage
        run: |
          mkdir -p target/coverage
          cargo llvm-cov --workspace --all-features --lcov --output-path target/coverage/lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          slug: daredem0/ToKi
          files: target/coverage/lcov.info
          use_oidc: true
          fail_ci_if_error: false

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: target/coverage/lcov.info
          if-no-files-found: error

  package-crate:
    name: Package Crate (.crate)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.ref_name == 'main' || github.ref_name == 'develop' || github.base_ref == 'main' || github.base_ref == 'develop'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Verify tag/version consistency
        run: ./scripts/verify-tag-version.sh

      - name: Build crate packages
        run: cargo package --locked --workspace --no-verify

      - name: Upload crate package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-crate
          path: target/package/*.crate
          if-no-files-found: error

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Generate docs
        run: RUSTDOCFLAGS="--html-in-header docs/mermaid-header.html" cargo doc --locked --workspace --no-deps --document-private-items

      - name: Create root docs index for GitHub Pages
        run: |
          set -euo pipefail
          cat > target/doc/index.html <<'DOCS'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <title>ToKi Rust Docs</title>
          </head>
          <body>
            <h1>ToKi Rust Documentation</h1>
            <p>
              Project landing page:
              <a href="./toki_core/index.html"><code>toki_core</code></a>
              (includes the repository README and SDD/SAD).
            </p>
            <ul>
              <li><a href="./toki_core/index.html">toki_core (project docs + API)</a></li>
              <li><a href="./toki_render/index.html">toki_render</a></li>
              <li><a href="./toki_runtime/index.html">toki_runtime</a></li>
              <li><a href="./toki_editor/index.html">toki_editor</a></li>
            </ul>
          </body>
          </html>
          DOCS
          touch target/doc/.nojekyll

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc

      - name: Archive docs for release assets
        run: tar -C target/doc -czf target/docs-html.tar.gz .

      - name: Upload docs release artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: target/docs-html.tar.gz
          if-no-files-found: error

  package-deb:
    name: Package (.deb)
    runs-on: ubuntu-22.04
    needs: build-release-linux
    if: startsWith(github.ref, 'refs/tags/') || github.ref_name == 'main' || github.ref_name == 'develop' || github.base_ref == 'main' || github.base_ref == 'develop'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Download prebuilt binaries
        uses: actions/download-artifact@v4
        with:
          name: binary-release-ubuntu-22.04
          path: target/release/

      - name: Build .deb
        run: |
          chmod +x scripts/build-deb.sh scripts/detect-libc-suffix.sh
          TOKI_USE_PREBUILT=1 ./scripts/build-deb.sh

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-deb
          path: target/debian/*.deb
          if-no-files-found: error

  package-arch:
    name: Package (Arch)
    runs-on: ubuntu-22.04
    needs: build-release-linux
    if: startsWith(github.ref, 'refs/tags/') || github.ref_name == 'main' || github.ref_name == 'develop' || github.base_ref == 'main' || github.base_ref == 'develop'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download prebuilt binaries
        uses: actions/download-artifact@v4
        with:
          name: binary-release-ubuntu-22.04
          path: target/release/

      - name: Build Arch package
        run: |
          chmod +x scripts/build-arch.sh scripts/detect-libc-suffix.sh
          docker run --rm \
            -v "${PWD}:/workspace" \
            -w /workspace \
            archlinux:latest \
            bash -lc '
              set -euo pipefail
              pacman -Sy --noconfirm --needed base-devel git bash sed curl alsa-lib
              HOST_UID="$(stat -c %u /workspace)"
              HOST_GID="$(stat -c %g /workspace)"
              HOST_GROUP="$(getent group "${HOST_GID}" | cut -d: -f1 || true)"
              if [[ -z "${HOST_GROUP}" ]]; then
                groupadd -g "${HOST_GID}" builder
                HOST_GROUP="builder"
              fi
              useradd -m -u "${HOST_UID}" -g "${HOST_GROUP}" builder
              su builder -c "TOKI_USE_PREBUILT=1 ./scripts/build-arch.sh"
            '

      - name: Upload Arch package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-arch
          path: target/arch/*.pkg.tar.*
          if-no-files-found: error

  package-appimage:
    name: Package (AppImage)
    runs-on: ubuntu-22.04
    needs: build-release-linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl file

      - name: Download prebuilt binaries
        uses: actions/download-artifact@v4
        with:
          name: binary-release-ubuntu-22.04
          path: target/release/

      - name: Build AppImage
        run: |
          chmod +x scripts/build-appimage.sh
          TOKI_USE_PREBUILT=1 ./scripts/build-appimage.sh

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-appimage
          path: target/appimage/*.AppImage
          if-no-files-found: error

  package-linux-portable:
    name: Package (Linux portable)
    runs-on: ubuntu-22.04
    needs: build-release-linux
    if: startsWith(github.ref, 'refs/tags/') || github.ref_name == 'main' || github.ref_name == 'develop' || github.base_ref == 'main' || github.base_ref == 'develop'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download prebuilt binaries
        uses: actions/download-artifact@v4
        with:
          name: binary-release-ubuntu-22.04
          path: target/release/

      - name: Derive version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"
          else
            VERSION="$(awk '/^\[workspace\.package\]/{f=1;next} /^\[/{f=0} f && /^version = /{gsub(/.*"|".*/, ""); print; exit}' Cargo.toml)"
            echo "value=${VERSION}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create portable tarball
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.value }}"
          STAGING="target/dist/toki-editor-${VERSION}-linux-x86_64"
          mkdir -p "${STAGING}"
          cp target/release/toki-editor "${STAGING}/"
          cp target/release/toki-runtime "${STAGING}/"
          cp LICENSE-TOKI.md THIRD_PARTY_LICENSES.md "${STAGING}/"
          tar -C target/dist -czf "target/dist/toki-editor-${VERSION}-linux-x86_64.tar.gz" "toki-editor-${VERSION}-linux-x86_64"

      - name: Upload Linux portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-linux-portable
          path: target/dist/*.tar.gz
          if-no-files-found: error

  package-windows-installer:
    name: Package (Windows installer)
    runs-on: windows-latest
    needs: build-release-windows
    if: startsWith(github.ref, 'refs/tags/') || github.ref_name == 'main' || github.ref_name == 'develop' || github.base_ref == 'main' || github.base_ref == 'develop'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download prebuilt binaries
        uses: actions/download-artifact@v4
        with:
          name: binary-release-windows
          path: target/release/

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Derive version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $value = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $cargo = Get-Content Cargo.toml -Raw
            if ($cargo -match '(?ms)^\[workspace\.package\].*?^version = "([^"]+)"') {
              $value = $Matches[1]
            } else {
              throw 'Unable to determine workspace version from Cargo.toml'
            }
          }
          "value=$value" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path packaging/windows/out | Out-Null
          Copy-Item target/release/toki-editor.exe packaging/windows/
          Copy-Item target/release/toki-runtime.exe packaging/windows/
          Copy-Item LICENSE-TOKI.md packaging/windows/
          Copy-Item THIRD_PARTY_LICENSES.md packaging/windows/
          & iscc "/DAppVersion=${{ steps.version.outputs.value }}" "/Opackaging/windows/out" packaging/windows/toki-editor.iss

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-windows-installer
          path: packaging/windows/out/*.exe
          if-no-files-found: error

  package-windows-portable:
    name: Package (Windows portable)
    runs-on: windows-latest
    needs: build-release-windows
    if: startsWith(github.ref, 'refs/tags/') || github.ref_name == 'main' || github.ref_name == 'develop' || github.base_ref == 'main' || github.base_ref == 'develop'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download prebuilt binaries
        uses: actions/download-artifact@v4
        with:
          name: binary-release-windows
          path: target/release/

      - name: Derive version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $value = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $cargo = Get-Content Cargo.toml -Raw
            if ($cargo -match '(?ms)^\[workspace\.package\].*?^version = "([^"]+)"') {
              $value = $Matches[1]
            } else {
              throw 'Unable to determine workspace version from Cargo.toml'
            }
          }
          "value=$value" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Create portable zip
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.value }}'
          $staging = "target/dist/toki-editor-$version-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item target/release/toki-editor.exe $staging
          Copy-Item target/release/toki-runtime.exe $staging
          Copy-Item LICENSE-TOKI.md $staging
          Copy-Item THIRD_PARTY_LICENSES.md $staging
          Compress-Archive -Path "$staging\*" -DestinationPath "target/dist/toki-editor-$version-windows-x86_64.zip" -Force

      - name: Upload Windows portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-windows-portable
          path: target/dist/*.zip
          if-no-files-found: error

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-debug-linux
      - build-debug-windows
      - build-release-linux
      - build-release-windows
      - test-linux
      - test-windows
      - clippy
      - fmt
      - coverage
      - package-crate
      - docs
      - package-deb
      - package-arch
      - package-appimage
      - package-linux-portable
      - package-windows-installer
      - package-windows-portable
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download debug binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binary-debug-*
          path: dist/binary-debug
          merge-multiple: true

      - name: Download release binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binary-release-*
          path: dist/binary-release
          merge-multiple: true

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist/packages
          merge-multiple: true

      - name: Download docs artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-html
          path: dist/docs-html

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-lcov
          path: dist/coverage-lcov

      - name: Prepare release assets
        run: |
          mkdir -p dist/release-assets
          cp dist/binary-debug/* dist/release-assets/ || true
          cp dist/binary-release/* dist/release-assets/ || true
          cp dist/packages/* dist/release-assets/ || true
          cp dist/docs-html/*.tar.gz dist/release-assets/
          cp dist/coverage-lcov/* dist/release-assets/

      - name: Extract release notes from CHANGELOG
        run: |
          set -euo pipefail
          mkdir -p dist
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          TAG_RE="$(printf '%s' "${TAG}" | sed -E 's/[][(){}.^$*+?|\\/]/\\&/g')"
          VERSION_RE="$(printf '%s' "${VERSION}" | sed -E 's/[][(){}.^$*+?|\\/]/\\&/g')"
          awk -v tag_re="${TAG_RE}" -v version_re="${VERSION_RE}" '
            BEGIN {
              capture = 0;
              match_header = "^## \\[(" tag_re "|" version_re ")\\]";
            }
            $0 ~ "^## \\[" && capture && $0 !~ match_header { exit }
            $0 ~ match_header { capture = 1 }
            capture { print }
          ' CHANGELOG.md > dist/release-notes.md

          if ! grep -q '[^[:space:]]' dist/release-notes.md; then
            echo "No CHANGELOG section found for tag ${TAG} (or ${VERSION})." >&2
            exit 1
          fi

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: dist/release-notes.md
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            dist/release-assets/*

  deploy-pages:
    name: Deploy Docs to GitHub Pages
    needs: [build-release-linux, build-release-windows, test-linux, test-windows, clippy, fmt, coverage, docs]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
